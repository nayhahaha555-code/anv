<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#030006"
    >

    <meta
        name="description"
        content="Our Galaxy ❤️ Happy Anniversary My Love"
    >

    <title>Our Galaxy ❤️</title>


    <!-- =====================================================
         GOOGLE FONTS
    ====================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <style>

        /* =====================================================
           RESET
        ====================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #030006;

            color: white;

            font-family: "Kanit", sans-serif;

            touch-action: none;

            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;

        }


        body {
            position: relative;
        }


        button {

            font-family: inherit;

            -webkit-tap-highlight-color: transparent;

            touch-action: manipulation;

        }


        /* =====================================================
           INTRO
        ====================================================== */

        #intro {

            position: fixed;

            inset: 0;

            z-index: 99999;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding: 25px;

            background:

                radial-gradient(
                    circle at center,
                    rgba(105, 0, 160, 0.35),
                    rgba(4, 0, 10, 0.98) 65%
                );

            transition:
                opacity 1s ease,
                visibility 1s ease;

        }


        #intro.hide {

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

        }


        .intro-small {

            font-family: "Orbitron", sans-serif;

            font-size:
                clamp(10px, 2vw, 15px);

            letter-spacing: 5px;

            opacity: 0.7;

            margin-bottom: 15px;

        }


        .intro-title {

            font-family:
                "Playfair Display",
                serif;

            font-size:
                clamp(42px, 10vw, 95px);

            line-height: 1.1;

            background:

                linear-gradient(
                    90deg,
                    #ffffff,
                    #ffb5eb,
                    #d37aff,
                    #ffffff
                );

            background-size: 300% auto;

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

            animation:
                titleGradient 5s linear infinite;

        }


        @keyframes titleGradient {

            0% {
                background-position: 0% center;
            }

            100% {
                background-position: 300% center;
            }

        }


        .intro-subtitle {

            margin-top: 15px;

            font-size:
                clamp(16px, 4vw, 27px);

            opacity: 0.85;

        }


        #enterBtn {

            margin-top: 45px;

            padding:
                15px 32px;

            border:
                1px solid
                rgba(255,255,255,0.5);

            border-radius: 999px;

            background:
                rgba(255,255,255,0.08);

            color: white;

            font-size: 18px;

            cursor: pointer;

            backdrop-filter:
                blur(10px);

            box-shadow:
                0 0 25px
                rgba(255,50,200,0.4);

            transition:
                transform 0.3s ease,
                background 0.3s ease,
                box-shadow 0.3s ease;

        }


        #enterBtn:hover {

            transform:
                translateY(-4px)
                scale(1.05);

            background:
                rgba(255,255,255,0.15);

            box-shadow:
                0 0 45px
                rgba(255,50,200,0.8);

        }


        #enterBtn:active {

            transform: scale(0.94);

        }


        /* =====================================================
           MAIN
        ====================================================== */

        #main {

            position: fixed;

            inset: 0;

            overflow: hidden;

            opacity: 0;

            transition:
                opacity 1.5s ease;

        }


        #main.show {

            opacity: 1;

        }


        /* =====================================================
           BACKGROUND
        ====================================================== */

        .space {

            position: absolute;

            inset: 0;

            overflow: hidden;

            background:

                radial-gradient(
                    ellipse at center,
                    rgba(95, 0, 140, 0.25),
                    transparent 60%
                );

        }


        .nebula {

            position: absolute;

            width: 85vw;
            height: 85vw;

            max-width: 1100px;
            max-height: 1100px;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            background:

                conic-gradient(
                    from 0deg,
                    rgba(255,0,200,0.05),
                    rgba(100,0,255,0.1),
                    rgba(0,180,255,0.05),
                    rgba(255,0,100,0.08),
                    rgba(255,0,200,0.05)
                );

            filter: blur(45px);

            animation:
                nebulaRotate 30s linear infinite;

        }


        @keyframes nebulaRotate {

            0% {

                transform:
                    translate(-50%, -50%)
                    rotate(0deg)
                    scale(1);

            }

            50% {

                transform:
                    translate(-50%, -50%)
                    rotate(180deg)
                    scale(1.15);

            }

            100% {

                transform:
                    translate(-50%, -50%)
                    rotate(360deg)
                    scale(1);

            }

        }


        /* =====================================================
           HEADER
        ====================================================== */

        .top {

            position: absolute;

            top: 20px;

            left: 50%;

            transform:
                translateX(-50%);

            width: 100%;

            z-index: 500;

            text-align: center;

            padding: 0 20px;

            pointer-events: none;

        }


        .top-small {

            font-family: "Orbitron", sans-serif;

            font-size:
                clamp(8px, 2vw, 13px);

            letter-spacing: 4px;

            opacity: 0.6;

        }


        .top-title {

            margin-top: 5px;

            font-family:
                "Playfair Display",
                serif;

            font-size:
                clamp(26px, 6vw, 55px);

            letter-spacing: 3px;

            text-shadow:
                0 0 15px
                rgba(255,100,220,0.7);

        }


        .top-subtitle {

            font-family:
                "Orbitron",
                sans-serif;

            font-size:
                clamp(8px, 1.7vw, 12px);

            letter-spacing: 4px;

            opacity: 0.55;

        }


        /* =====================================================
           UNIVERSE
        ====================================================== */

        .universe {

            position: absolute;

            left: 50%;
            top: 50%;

            width: 1px;
            height: 1px;

            transform:
                translate(-50%, -50%);

            perspective: 1200px;

            transform-style: preserve-3d;

            touch-action: none;

        }


        #system {

            position: absolute;

            left: 0;
            top: 0;

            width: 1px;
            height: 1px;

            transform-style: preserve-3d;

            transition:
                transform 0.08s linear;

        }


        /* =====================================================
           HEART STARS
        ====================================================== */

        .heart-star {

            position: absolute;

            width: 4px;
            height: 4px;

            transform-style: preserve-3d;

            animation:
                twinkle
                var(--duration)
                ease-in-out
                infinite alternate;

        }


        .heart-star::before {

            content: "❤";

            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            font-size:
                var(--size);

            color: currentColor;

            text-shadow:
                0 0 5px currentColor,
                0 0 12px currentColor;

        }


        @keyframes twinkle {

            from {

                opacity: 0.15;

                transform: scale(0.7);

            }

            to {

                opacity: 1;

                transform: scale(1.2);

            }

        }


        /* =====================================================
           ORBITS
        ====================================================== */

        .orbit {

            position: absolute;

            left: 50%;
            top: 50%;

            border:
                1px solid
                rgba(255,255,255,0.08);

            border-radius: 50%;

            transform:
                translate(-50%, -50%);

            transform-style: preserve-3d;

            pointer-events: none;

        }


        .orbit:nth-child(1) {

            width: 180px;
            height: 180px;

        }


        .orbit:nth-child(2) {

            width: 300px;
            height: 300px;

        }


        .orbit:nth-child(3) {

            width: 430px;
            height: 430px;

        }


        .orbit:nth-child(4) {

            width: 560px;
            height: 560px;

        }


        .orbit:nth-child(5) {

            width: 690px;
            height: 690px;

        }


        /* =====================================================
           PHOTOS
        ====================================================== */

        .photo {

            position: absolute;

            width: 90px;
            height: 110px;

            object-fit: cover;

            border-radius: 12px;

            border:
                2px solid
                rgba(255,255,255,0.6);

            box-shadow:

                0 0 15px
                rgba(255,80,210,0.5),

                0 0 35px
                rgba(130,50,255,0.3);

            transform-style: preserve-3d;

            pointer-events: auto;

            cursor: pointer;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;

        }


        .photo:hover {

            transform:
                scale(1.15);

            box-shadow:

                0 0 25px
                rgba(255,100,220,0.9),

                0 0 55px
                rgba(130,50,255,0.6);

            z-index: 100;

        }


        /* =====================================================
           CENTER HEART
        ====================================================== */

        .center-heart {

            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            font-size:
                clamp(50px, 12vw, 100px);

            color: #ff4fbd;

            text-shadow:

                0 0 10px #ff4fbd,

                0 0 30px #ff4fbd,

                0 0 70px #ff008c;

            animation:
                heartBeat 1.4s ease-in-out infinite;

            z-index: 50;

        }


        @keyframes heartBeat {

            0%,
            100% {

                transform:
                    translate(-50%, -50%)
                    scale(1);

            }

            50% {

                transform:
                    translate(-50%, -50%)
                    scale(1.18);

            }

        }


        /* =====================================================
           BUTTERFLY
        ====================================================== */

        .butterfly {

            position: fixed;

            z-index: 400;

            pointer-events: none;

            font-size: 20px;

            filter:
                drop-shadow(
                    0 0 8px
                    rgba(255,120,230,0.8)
                );

            animation:
                butterflyFloat
                var(--duration)
                linear forwards;

        }


        @keyframes butterflyFloat {

            0% {

                transform:
                    translate(
                        var(--start-x),
                        110vh
                    )
                    rotate(
                        var(--rotate)
                    );

                opacity: 0;

            }

            10% {

                opacity: 1;

            }

            90% {

                opacity: 1;

            }

            100% {

                transform:
                    translate(
                        var(--end-x),
                        -20vh
                    )
                    rotate(
                        calc(
                            var(--rotate) + 360deg
                        )
                    );

                opacity: 0;

            }

        }


        /* =====================================================
           FLOAT HEART
        ====================================================== */

        .floating-heart {

            position: fixed;

            pointer-events: none;

            z-index: 300;

            color:
                rgba(255,100,200,0.9);

            text-shadow:
                0 0 10px currentColor;

            animation:
                floatHeart 5s ease-out forwards;

        }


        @keyframes floatHeart {

            from {

                opacity: 0;

                transform:
                    translateY(0)
                    scale(0.5);

            }

            15% {

                opacity: 1;

            }

            to {

                opacity: 0;

                transform:
                    translateY(-250px)
                    scale(1.4)
                    rotate(25deg);

            }

        }


        /* =====================================================
           MUSIC BUTTON
        ====================================================== */

        #musicBtn {

            position: fixed;

            right: 20px;
            bottom: 20px;

            z-index: 5000;

            width: 52px;
            height: 52px;

            border-radius: 50%;

            border:
                1px solid
                rgba(255,255,255,0.4);

            background:
                rgba(255,255,255,0.1);

            color: white;

            font-size: 22px;

            cursor: pointer;

            backdrop-filter:
                blur(10px);

            box-shadow:
                0 0 20px
                rgba(255,50,200,0.35);

            transition:
                0.3s ease;

        }


        #musicBtn:hover {

            transform: scale(1.1);

            box-shadow:
                0 0 35px
                rgba(255,50,200,0.7);

        }


        /* =====================================================
           HINT
        ====================================================== */

        .hint {

            position: fixed;

            left: 50%;
            bottom: 20px;

            transform:
                translateX(-50%);

            z-index: 500;

            padding:
                8px 15px;

            border-radius: 999px;

            background:
                rgba(0,0,0,0.3);

            border:
                1px solid
                rgba(255,255,255,0.1);

            backdrop-filter:
                blur(8px);

            font-size: 12px;

            opacity: 0.6;

            text-align: center;

            white-space: nowrap;

        }


        /* =====================================================
           EXPLOSION
        ====================================================== */

        .explosion-heart {

            position: fixed;

            pointer-events: none;

            z-index: 9000;

            font-size: 20px;

            color: #ff69c7;

            text-shadow:

                0 0 10px #ff69c7,

                0 0 25px #ff008c;

            animation:
                explodeHeart 1s ease-out forwards;

        }


        @keyframes explodeHeart {

            from {

                opacity: 1;

                transform:
                    translate(-50%, -50%)
                    scale(0.4);

            }

            to {

                opacity: 0;

                transform:
                    translate(
                        var(--tx),
                        var(--ty)
                    )
                    scale(1.5)
                    rotate(
                        var(--rotation)
                    );

            }

        }


        /* =====================================================
           SHOOTING STAR
        ====================================================== */

        .shooting-star {

            position: fixed;

            width: 100px;
            height: 2px;

            background:

                linear-gradient(
                    90deg,
                    transparent,
                    white
                );

            border-radius: 999px;

            transform:
                rotate(-35deg);

            pointer-events: none;

            z-index: 100;

            animation:
                shootingStar
                1.5s
                linear
                forwards;

        }


        @keyframes shootingStar {

            from {

                opacity: 0;

                transform:
                    translate(0,0)
                    rotate(-35deg);

            }

            10% {

                opacity: 1;

            }

            to {

                opacity: 0;

                transform:
                    translate(
                        -400px,
                        400px
                    )
                    rotate(-35deg);

            }

        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media (max-width: 600px) {


            .top {

                top: 10px;

            }


            .top-title {

                letter-spacing: 1px;

            }


            .top-subtitle {

                letter-spacing: 2px;

            }


            .photo {

                width: 65px;
                height: 82px;

                border-radius: 9px;

            }


            .orbit:nth-child(1) {

                width: 120px;
                height: 120px;

            }


            .orbit:nth-child(2) {

                width: 200px;
                height: 200px;

            }


            .orbit:nth-child(3) {

                width: 285px;
                height: 285px;

            }


            .orbit:nth-child(4) {

                width: 370px;
                height: 370px;

            }


            .orbit:nth-child(5) {

                width: 455px;
                height: 455px;

            }


            #musicBtn {

                width: 46px;
                height: 46px;

                right: 14px;
                bottom: 14px;

                font-size: 19px;

            }


            .hint {

                bottom: 15px;

                font-size: 10px;

                max-width: 70%;

                white-space: normal;

            }

        }


        @media (max-height: 600px) {

            .top {

                top: 6px;

            }


            .hint {

                display: none;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         MUSIC
    ====================================================== -->

    <audio
        id="music"
        loop
        preload="auto"
    >

        <source
            src="โลกอิจฉา - เอ๊ะ จิรากร [Official Lyrics Video].mp4"
            type="audio/mp4"
        >

    </audio>


    <!-- =====================================================
         INTRO
    ====================================================== -->

    <section id="intro">

        <div class="intro-small">
            HAPPY ANNIVERSARY MY LOVE
        </div>


        <div class="intro-title">
            Gift & Nay
        </div>


        <div class="intro-subtitle">
            ❤️
        </div>


        <button id="enterBtn">
            จิ้มตรงนี้เลยยย ❤️
        </button>

    </section>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main id="main">


        <div class="space">

            <div class="nebula"></div>

        </div>


        <!-- TOP -->

        <div class="top">

            <div class="top-small">
                OUR LOVE • OUR UNIVERSE
            </div>


            <div class="top-title">
                OUR GALAXY
            </div>


            <div class="top-subtitle">
                HAPPY ANNIVERSARY
            </div>

        </div>


        <!-- UNIVERSE -->

        <div class="universe">

            <div id="system">


                <!-- CENTER HEART -->

                <div class="center-heart">
                    ❤
                </div>


                <!-- ORBITS -->

                <div class="orbit"></div>

                <div class="orbit"></div>

                <div class="orbit"></div>

                <div class="orbit"></div>

                <div class="orbit"></div>


            </div>

        </div>


        <!-- MUSIC -->

        <button
            id="musicBtn"
            title="เปิด/ปิดเพลง"
        >
            🎵
        </button>


        <!-- HINT -->

        <div class="hint">

            ลากเพื่อหมุน Galaxy
            •
            ใช้ 2 นิ้วเพื่อ Zoom ❤️

        </div>


    </main>


    <script>


        /* =====================================================
           ELEMENTS
        ====================================================== */

        const intro =
            document.getElementById("intro");


        const main =
            document.getElementById("main");


        const enterBtn =
            document.getElementById("enterBtn");


        const music =
            document.getElementById("music");


        const musicBtn =
            document.getElementById("musicBtn");


        const system =
            document.getElementById("system");


        /* =====================================================
           VARIABLES
        ====================================================== */

        let rotateX = -8;

        let rotateY = 0;

        let zoom = 1;

        let mouseDown = false;

        let lastX = 0;

        let lastY = 0;

        let initialDistance = null;

        let initialZoom = 1;

        let touchDragging = false;

        let touchLastX = 0;

        let touchLastY = 0;


        /* =====================================================
           ENTER WEBSITE
        ====================================================== */

        enterBtn.addEventListener(
            "click",
            function () {


                intro.classList.add(
                    "hide"
                );


                main.classList.add(
                    "show"
                );


                /* PLAY MUSIC */

                music.play()
                    .then(
                        function () {

                            musicBtn.textContent =
                                "🔊";

                        }
                    )
                    .catch(
                        function () {

                            musicBtn.textContent =
                                "🎵";

                        }
                    );


                /* HEART EFFECT */

                createHeartExplosion(
                    window.innerWidth / 2,
                    window.innerHeight / 2,
                    35
                );

            }
        );


        /* =====================================================
           MUSIC BUTTON
        ====================================================== */

        musicBtn.addEventListener(
            "click",
            function () {


                if (
                    music.paused
                ) {

                    music.play()
                        .then(
                            function () {

                                musicBtn.textContent =
                                    "🔊";

                            }
                        )
                        .catch(
                            function () {

                                musicBtn.textContent =
                                    "🎵";

                            }
                        );

                } else {

                    music.pause();

                    musicBtn.textContent =
                        "🔇";

                }

            }
        );


        /* =====================================================
           ZOOM
        ====================================================== */

        function setZoom(value) {


            zoom =
                Math.max(
                    0.55,
                    Math.min(
                        1.8,
                        value
                    )
                );


            updateSystem();

        }


        /* =====================================================
           UPDATE SYSTEM
        ====================================================== */

        function updateSystem() {


            system.style.transform =

                `
                rotateX(${rotateX}deg)
                rotateY(${rotateY}deg)
                scale(${zoom})
                `;

        }


        updateSystem();


        /* =====================================================
           MOUSE DOWN
        ====================================================== */

        window.addEventListener(
            "mousedown",
            function (e) {


                mouseDown = true;

                lastX =
                    e.clientX;

                lastY =
                    e.clientY;

            }
        );


        /* =====================================================
           MOUSE MOVE
        ====================================================== */

        window.addEventListener(
            "mousemove",
            function (e) {


                if (!mouseDown) {
                    return;
                }


                const dx =
                    e.clientX -
                    lastX;


                const dy =
                    e.clientY -
                    lastY;


                rotateY +=
                    dx * 0.35;


                rotateX -=
                    dy * 0.25;


                rotateX =
                    Math.max(
                        -35,
                        Math.min(
                            35,
                            rotateX
                        )
                    );


                lastX =
                    e.clientX;


                lastY =
                    e.clientY;


                updateSystem();

            }
        );


        /* =====================================================
           MOUSE UP
        ====================================================== */

        window.addEventListener(
            "mouseup",
            function () {

                mouseDown = false;

            }
        );


        /* =====================================================
           WHEEL ZOOM
        ====================================================== */

        window.addEventListener(
            "wheel",
            function (e) {


                e.preventDefault();


                setZoom(
                    zoom -
                    e.deltaY * 0.001
                );

            },
            {
                passive: false
            }
        );


        /* =====================================================
           MOBILE TOUCH START
        ====================================================== */

        window.addEventListener(
            "touchstart",
            function (e) {


                /* ONE FINGER */

                if (
                    e.touches.length === 1
                ) {


                    touchDragging = true;


                    touchLastX =
                        e.touches[0].clientX;


                    touchLastY =
                        e.touches[0].clientY;

                }


                /* TWO FINGERS */

                if (
                    e.touches.length === 2
                ) {


                    touchDragging = false;


                    const a =
                        e.touches[0];


                    const b =
                        e.touches[1];


                    const dx =
                        a.clientX -
                        b.clientX;


                    const dy =
                        a.clientY -
                        b.clientY;


                    initialDistance =
                        Math.sqrt(
                            dx * dx +
                            dy * dy
                        );


                    initialZoom =
                        zoom;

                }

            },
            {
                passive: true
            }
        );


        /* =====================================================
           MOBILE TOUCH MOVE
        ====================================================== */

        window.addEventListener(
            "touchmove",
            function (e) {


                /* TWO FINGER ZOOM */

                if (
                    e.touches.length === 2
                ) {


                    e.preventDefault();


                    const a =
                        e.touches[0];


                    const b =
                        e.touches[1];


                    const dx =
                        a.clientX -
                        b.clientX;


                    const dy =
                        a.clientY -
                        b.clientY;


                    const distance =
                        Math.sqrt(
                            dx * dx +
                            dy * dy
                        );


                    if (
                        initialDistance
                    ) {


                        const scale =
                            distance /
                            initialDistance;


                        setZoom(
                            initialZoom *
                            scale
                        );

                    }


                    return;

                }


                /* ONE FINGER ROTATE */

                if (
                    e.touches.length === 1 &&
                    touchDragging
                ) {


                    e.preventDefault();


                    const currentX =
                        e.touches[0].clientX;


                    const currentY =
                        e.touches[0].clientY;


                    const dx =
                        currentX -
                        touchLastX;


                    const dy =
                        currentY -
                        touchLastY;


                    rotateY +=
                        dx * 0.35;


                    rotateX -=
                        dy * 0.25;


                    rotateX =
                        Math.max(
                            -35,
                            Math.min(
                                35,
                                rotateX
                            )
                        );


                    touchLastX =
                        currentX;


                    touchLastY =
                        currentY;


                    updateSystem();

                }

            },
            {
                passive: false
            }
        );


        /* =====================================================
           TOUCH END
        ====================================================== */

        window.addEventListener(
            "touchend",
            function () {


                touchDragging = false;

                initialDistance = null;

            }
        );


        /* =====================================================
           HEART STAR COUNT
        ====================================================== */

        const isMobile =
            window.innerWidth <= 600;


        const heartStarCount =
            isMobile
                ? 500
                : 900;


        /* =====================================================
           CREATE HEART STARS
        ====================================================== */

        for (
            let i = 0;
            i < heartStarCount;
            i++
        ) {


            const star =
                document.createElement(
                    "div"
                );


            star.className =
                "heart-star";


            const angle =
                Math.random() *
                Math.PI *
                2;


            const radius =
                120 +
                Math.random() *
                (
                    isMobile
                        ? 450
                        : 750
                );


            const x =
                Math.cos(angle) *
                radius;


            const y =
                Math.sin(angle) *
                radius;


            const z =
                (
                    Math.random() -
                    0.5
                ) *
                900;


            star.style.left =
                `${x}px`;


            star.style.top =
                `${y}px`;


            star.style.transform =
                `translateZ(${z}px)`;


            star.style.setProperty(
                "--size",
                `${
                    3 +
                    Math.random() * 7
                }px`
            );


            star.style.setProperty(
                "--duration",
                `${
                    1 +
                    Math.random() * 3
                }s`
            );


            const colors = [

                "#ff9de2",

                "#ffd4f3",

                "#d49cff",

                "#ffffff",

                "#ff70c8"

            ];


            star.style.color =
                colors[
                    Math.floor(
                        Math.random() *
                        colors.length
                    )
                ];


            system.appendChild(
                star
            );

        }


        /* =====================================================
           PHOTOS
        ====================================================== */

        const photos = [

            "01.jpg",
            "02.jpg",
            "03.jpg",
            "04.jpg",
            "05.jpg",
            "06.jpg",
            "07.jpg",
            "08.jpg",
            "09.jpg",
            "10.jpg",
            "11.jpg",
            "12.jpg",
            "13.jpg",
            "14.jpg",
            "15.jpg",
            "16.jpg",
            "17.jpg",
            "18.jpg",
            "19.jpg",
            "20.jpg",
            "21.jpg",
            "22.jpg",
            "23.jpg",
            "24.jpg",
            "25.jpg"

        ];


        const orbits =
            document.querySelectorAll(
                ".orbit"
            );


        /* =====================================================
           CREATE PHOTO ORBITS
        ====================================================== */

        photos.forEach(
            function (
                photoName,
                index
            ) {


                const orbitIndex =
                    index %
                    orbits.length;


                const orbit =
                    orbits[
                        orbitIndex
                    ];


                const img =
                    document.createElement(
                        "img"
                    );


                img.className =
                    "photo";


                img.src =
                    photoName;


                img.alt =
                    `รูปความทรงจำ ${index + 1}`;


                img.loading =
                    "lazy";


                img.draggable =
                    false;


                const orbitSize =
                    180 +
                    (
                        orbitIndex *
                        120
                    );


                const itemsPerOrbit =
                    Math.ceil(
                        photos.length /
                        orbits.length
                    );


                const angle =
                    (
                        index %
                        itemsPerOrbit
                    ) *
                    (
                        360 /
                        itemsPerOrbit
                    );


                const rad =
                    angle *
                    Math.PI /
                    180;


                const x =
                    Math.cos(rad) *
                    (
                        orbitSize / 2
                    );


                const y =
                    Math.sin(rad) *
                    (
                        orbitSize / 2
                    );


                img.style.left =
                    `${x}px`;


                img.style.top =
                    `${y}px`;


                img.style.transform =

                    `
                    translate(-50%, -50%)
                    rotateZ(${angle}deg)
                    translateZ(${
                        Math.random() * 100
                    }px)
                    `;


                /* PHOTO CLICK */

                img.addEventListener(
                    "click",
                    function (e) {


                        e.stopPropagation();


                        createHeartExplosion(
                            e.clientX,
                            e.clientY,
                            20
                        );

                    }
                );


                /* IMAGE ERROR */

                img.addEventListener(
                    "error",
                    function () {


                        img.style.opacity =
                            "0.3";

                    }
                );


                orbit.appendChild(
                    img
                );

            }
        );


        /* =====================================================
           BUTTERFLY
        ====================================================== */

        function createButterfly() {


            const butterfly =
                document.createElement(
                    "div"
                );


            butterfly.className =
                "butterfly";


            butterfly.textContent =
                Math.random() > 0.15
                    ? "🦋"
                    : "✨";


            const startX =
                Math.random() *
                100;


            const endX =
                startX +
                (
                    Math.random() *
                    30 -
                    15
                );


            butterfly.style.setProperty(
                "--start-x",
                `${startX}vw`
            );


            butterfly.style.setProperty(
                "--end-x",
                `${endX}vw`
            );


            butterfly.style.setProperty(
                "--rotate",
                `${
                    Math.random() *
                    60 -
                    30
                }deg`
            );


            butterfly.style.setProperty(
                "--duration",
                `${
                    6 +
                    Math.random() *
                    6
                }s`
            );


            butterfly.style.fontSize =
                `${
                    16 +
                    Math.random() *
                    14
                }px`;


            document.body.appendChild(
                butterfly
            );


            setTimeout(
                function () {

                    butterfly.remove();

                },
                13000
            );

        }


        /* INITIAL BUTTERFLIES */

        const initialButterflies =
            isMobile
                ? 6
                : 15;


        for (
            let i = 0;
            i < initialButterflies;
            i++
        ) {


            setTimeout(
                createButterfly,
                i * 500
            );

        }


        /* NEW BUTTERFLY */

        setInterval(
            createButterfly,
            isMobile
                ? 2200
                : 1200
        );


        /* =====================================================
           FLOATING HEART
        ====================================================== */

        function createFloatingHeart() {


            const heart =
                document.createElement(
                    "div"
                );


            heart.className =
                "floating-heart";


            heart.textContent =
                "❤";


            heart.style.left =
                `${
                    Math.random() *
                    100
                }vw`;


            heart.style.bottom =
                "-20px";


            heart.style.fontSize =
                `${
                    12 +
                    Math.random() *
                    20
                }px`;


            document.body.appendChild(
                heart
            );


            setTimeout(
                function () {

                    heart.remove();

                },
                5500
            );

        }


        setInterval(
            createFloatingHeart,
            isMobile
                ? 1800
                : 1000
        );


        /* =====================================================
           HEART EXPLOSION
        ====================================================== */

        function createHeartExplosion(
            x,
            y,
            count
        ) {


            for (
                let i = 0;
                i < count;
                i++
            ) {


                const heart =
                    document.createElement(
                        "div"
                    );


                heart.className =
                    "explosion-heart";


                heart.textContent =
                    Math.random() > 0.3
                        ? "❤"
                        : "✨";


                heart.style.left =
                    `${x}px`;


                heart.style.top =
                    `${y}px`;


                const angle =
                    Math.random() *
                    Math.PI *
                    2;


                const distance =
                    60 +
                    Math.random() *
                    180;


                const tx =
                    Math.cos(angle) *
                    distance;


                const ty =
                    Math.sin(angle) *
                    distance;


                heart.style.setProperty(
                    "--tx",
                    `${tx}px`
                );


                heart.style.setProperty(
                    "--ty",
                    `${ty}px`
                );


                heart.style.setProperty(
                    "--rotation",
                    `${
                        Math.random() *
                        720 -
                        360
                    }deg`
                );


                heart.style.fontSize =
                    `${
                        12 +
                        Math.random() *
                        18
                    }px`;


                document.body.appendChild(
                    heart
                );


                setTimeout(
                    function () {

                        heart.remove();

                    },
                    1100
                );

            }

        }


        /* =====================================================
           CLICK SCREEN
        ====================================================== */

        document.addEventListener(
            "click",
            function (e) {


                if (
                    e.target.closest(
                        "#enterBtn"
                    )
                ) {

                    return;

                }


                if (
                    e.target.closest(
                        "#musicBtn"
                    )
                ) {

                    return;

                }


                createHeartExplosion(
                    e.clientX,
                    e.clientY,
                    isMobile
                        ? 10
                        : 16
                );

            }
        );


        /* =====================================================
           SHOOTING STAR
        ====================================================== */

        function createShootingStar() {


            const star =
                document.createElement(
                    "div"
                );


            star.className =
                "shooting-star";


            star.style.left =
                `${
                    60 +
                    Math.random() *
                    40
                }vw`;


            star.style.top =
                `${
                    Math.random() *
                    35
                }vh`;


            document.body.appendChild(
                star
            );


            setTimeout(
                function () {

                    star.remove();

                },
                1600
            );

        }


        setInterval(
            createShootingStar,
            isMobile
                ? 4500
                : 3000
        );


        /* =====================================================
           PERIODIC HEART EXPLOSION
        ====================================================== */

        setInterval(
            function () {


                if (
                    main.classList.contains(
                        "show"
                    )
                ) {


                    createHeartExplosion(
                        window.innerWidth / 2,
                        window.innerHeight / 2,
                        isMobile
                            ? 12
                            : 22
                    );

                }

            },
            isMobile
                ? 9000
                : 6500
        );


        /* =====================================================
           PREVENT IMAGE DRAG
        ====================================================== */

        document.addEventListener(
            "dragstart",
            function (e) {


                if (
                    e.target.tagName ===
                    "IMG"
                ) {

                    e.preventDefault();

                }

            }
        );


        /* =====================================================
           RESIZE
        ====================================================== */

        window.addEventListener(
            "resize",
            function () {

                updateSystem();

            }
        );

    </script>

</body>

</html>
